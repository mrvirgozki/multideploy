static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          route_config:
            name: local_route
            virtual_hosts:
            - name: all_hosts
              domains: ["*"]
              routes:
              - match: { prefix: "/vless-virgozki" }
                route: { cluster: xray_vless, timeout: 0s, idle_timeout: 86400s }
                request_headers_to_add:
                - header: { key: "Upgrade", value: "websocket" }
                - header: { key: "Connection", value: "Upgrade" }
              - match: { prefix: "/vmess-virgozki" }
                route: { cluster: xray_vmess, timeout: 0s, idle_timeout: 86400s }
                request_headers_to_add:
                - header: { key: "Upgrade", value: "websocket" }
                - header: { key: "Connection", value: "Upgrade" }
              - match: { prefix: "/trojan-virgozki" }
                route: { cluster: xray_trojan, timeout: 0s, idle_timeout: 86400s }
                request_headers_to_add:
                - header: { key: "Upgrade", value: "websocket" }
                - header: { key: "Connection", value: "Upgrade" }
              - match: { prefix: "/ss-virgozki" }
                route: { cluster: xray_ss, timeout: 0s, idle_timeout: 86400s }
                request_headers_to_add:
                - header: { key: "Upgrade", value: "websocket" }
                - header: { key: "Connection", value: "Upgrade" }
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: xray_vless
    connect_timeout: 3s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: xray_vless
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 127.0.0.1, port_value: 10001 }
  - name: xray_vmess
    connect_timeout: 3s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: xray_vmess
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 127.0.0.1, port_value: 10002 }
  - name: xray_trojan
    connect_timeout: 3s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: xray_trojan
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 127.0.0.1, port_value: 10003 }
  - name: xray_ss
    connect_timeout: 3s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: xray_ss
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 127.0.0.1, port_value: 10004 }
