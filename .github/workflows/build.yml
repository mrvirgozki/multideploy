name: Build & Push to Docker Hub

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: 🏗️ Build at Push Image
        uses: docker/build-push-action@v6 # Updated to latest v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: mrvirgozki/multideploy:latest
          cache-from: type=registry,ref=mrvirgozki/multideploy:buildcache
          cache-to: type=registry,ref=mrvirgozki/multideploy:buildcache,mode=max
